name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "9.4.1"
          cache-disabled: true

      - name: Enable build scripts
        run: chmod +x scripts/*.sh

      - name: Run core tests
        run: scripts/test-core.sh

      - name: Run LAN HTTP tests
        run: scripts/test-lan-http.sh

      - name: Run browser client tests
        run: node --test web-tests/*.test.mjs

      - name: Check Android emulator acceleration
        id: android_emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm -a -w /dev/kvm; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Android device tests skipped because this GitHub runner has no usable /dev/kvm.'
          fi

      - name: Run Android device tests
        if: steps.android_emulator.outputs.available == 'true'
        continue-on-error: true
        run: >-
          gradle --no-daemon pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Report skipped Android device tests
        if: steps.android_emulator.outputs.available != 'true'
        run: echo 'Android device tests were skipped because KVM is unavailable on this runner.'

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          signing_path=$(scripts/prepare-signing.sh "$RUNNER_TEMP/password-vault-signing")
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$signing_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Remove release keystore
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/password-vault-signing"

      - name: Upload APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: password-vault-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
